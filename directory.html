<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Doctors - Salone Health Connect</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="directory-container">
    <nav class="dashboard-nav">
      <div class="nav-brand">
        <span class="logo-icon">🏥</span>
        <span>Salone Health</span>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="patient.html">Dashboard</a>
        <a href="support.html">Support</a>
      </div>
      <button class="mobile-menu-btn" id="dashboardMenuBtn">☰</button>
    </nav>

    <div class="dashboard-mobile-menu" id="dashboardMobileMenu">
      <a href="index.html">Home</a>
      <a href="patient.html">Dashboard</a>
      <a href="support.html">Support</a>
    </div>

    <main class="directory-main">
      <header class="directory-header">
        <h1>Find Doctors & Clinics</h1>
        <p>Connect with verified healthcare professionals across Sierra Leone</p>
      </header>

      <div class="search-filters">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search by name, specialty, or location..." oninput="filterDoctors()">
          <button class="search-btn">🔍</button>
        </div>
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
          <button class="filter-btn" data-filter="general" onclick="setFilter('general')">General Practice</button>
          <button class="filter-btn" data-filter="pediatric" onclick="setFilter('pediatric')">Pediatrics</button>
          <button class="filter-btn" data-filter="surgery" onclick="setFilter('surgery')">Surgery</button>
          <button class="filter-btn" data-filter="obstetrics" onclick="setFilter('obstetrics')">Obstetrics</button>
        </div>
      </div>

      <section class="doctors-section">
        <h2>Available Doctors</h2>
        <div class="doctors-grid" id="doctorsGrid">
          <!-- Doctor cards will be generated by JS -->
        </div>
      </section>

      <section class="clinics-section">
        <h2>Healthcare Facilities</h2>
        <div class="clinics-grid" id="clinicsGrid">
          <!-- Clinic cards will be generated by JS -->
        </div>
      </section>
    </main>

    <footer class="dashboard-footer">
      <p>© 2025 Salone Health Connect | <a href="support.html">Need Help?</a></p>
    </footer>
  </div>

  <!-- Booking Modal -->
  <div class="modal" id="bookingModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-header">
        <h2>Book Appointment</h2>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Content filled by JS -->
      </div>
    </div>
  </div>

  <!-- Floating WhatsApp Button -->
  <a href="https://wa.me/23273095177" target="_blank" class="whatsapp-float">
    <span>💬</span>
  </a>

  <script src="js/navigation.js"></script>
  <script>
    const doctors = [
      {
        id: 1,
        name: "Dr. Amara Kamara",
        specialty: "general",
        title: "General Practitioner",
        hospital: "Connaught Hospital",
        location: "Freetown",
        rating: 4.9,
        reviews: 124,
        available: true,
        image: "/placeholder.svg?height=200&width=200"
      },
      {
        id: 2,
        name: "Dr. Fatmata Sesay",
        specialty: "pediatric",
        title: "Pediatrician",
        hospital: "Ola During Children's Hospital",
        location: "Freetown",
        rating: 4.8,
        reviews: 98,
        available: true,
        image: "/placeholder.svg?height=200&width=200"
      },
      {
        id: 3,
        name: "Dr. Mohamed Conteh",
        specialty: "surgery",
        title: "General Surgeon",
        hospital: "Choithram Memorial Hospital",
        location: "Freetown",
        rating: 4.7,
        reviews: 76,
        available: false,
        image: "/placeholder.svg?height=200&width=200"
      },
      {
        id: 4,
        name: "Dr. Isatu Bangura",
        specialty: "obstetrics",
        title: "Obstetrician & Gynecologist",
        hospital: "Princess Christian Maternity Hospital",
        location: "Freetown",
        rating: 4.9,
        reviews: 156,
        available: true,
        image: "/placeholder.svg?height=200&width=200"
      },
      {
        id: 5,
        name: "Dr. Ibrahim Koroma",
        specialty: "general",
        title: "General Practitioner",
        hospital: "34 Military Hospital",
        location: "Wilberforce",
        rating: 4.6,
        reviews: 89,
        available: true,
        image: "/placeholder.svg?height=200&width=200"
      },
      {
        id: 6,
        name: "Dr. Mariama Jalloh",
        specialty: "pediatric",
        title: "Pediatrician",
        hospital: "MedCare Clinic",
        location: "Aberdeen",
        rating: 4.8,
        reviews: 67,
        available: true,
        image: "/placeholder.svg?height=200&width=200"
      }
    ];

    const clinics = [
      {
        id: 1,
        name: "Connaught Hospital",
        type: "Public Hospital",
        location: "Freetown Central",
        services: ["Emergency", "Surgery", "Outpatient"],
        image: "/placeholder.svg?height=200&width=300"
      },
      {
        id: 2,
        name: "Choithram Memorial Hospital",
        type: "Private Hospital",
        location: "Freetown",
        services: ["Surgery", "Maternity", "Diagnostics"],
        image: "/placeholder.svg?height=200&width=300"
      },
      {
        id: 3,
        name: "MedCare Clinic",
        type: "Private Clinic",
        location: "Aberdeen, Freetown",
        services: ["General Practice", "Pediatrics", "Lab"],
        image: "/placeholder.svg?height=200&width=300"
      },
      {
        id: 4,
        name: "HealthPlus Medical Center",
        type: "Private Clinic",
        location: "Hill Station",
        services: ["General Practice", "Pharmacy", "Diagnostics"],
        image: "/placeholder.svg?height=200&width=300"
      }
    ];

    let currentFilter = 'all';

    function renderDoctors() {
      const grid = document.getElementById('doctorsGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = doctors.filter(doc => {
        const matchesFilter = currentFilter === 'all' || doc.specialty === currentFilter;
        const matchesSearch = doc.name.toLowerCase().includes(searchTerm) || 
                            doc.title.toLowerCase().includes(searchTerm) ||
                            doc.location.toLowerCase().includes(searchTerm);
        return matchesFilter && matchesSearch;
      });

      grid.innerHTML = filtered.map(doc => `
        <div class="doctor-card" onclick="openBooking(${doc.id})">
          <div class="doctor-image">
            <img src="${doc.image}" alt="${doc.name}">
            <span class="availability-badge ${doc.available ? 'available' : 'unavailable'}">
              ${doc.available ? 'Available' : 'Unavailable'}
            </span>
          </div>
          <div class="doctor-info">
            <h3>${doc.name}</h3>
            <p class="doctor-title">${doc.title}</p>
            <p class="doctor-hospital">🏥 ${doc.hospital}</p>
            <p class="doctor-location">📍 ${doc.location}</p>
            <div class="doctor-rating">
              <span class="stars">⭐ ${doc.rating}</span>
              <span class="reviews">(${doc.reviews} reviews)</span>
            </div>
            <button class="btn btn-primary btn-small">Book Appointment</button>
          </div>
        </div>
      `).join('');
    }

    function renderClinics() {
      const grid = document.getElementById('clinicsGrid');
      
      grid.innerHTML = clinics.map(clinic => `
        <div class="clinic-card" onclick="viewClinic(${clinic.id})">
          <div class="clinic-image">
            <img src="${clinic.image}" alt="${clinic.name}">
          </div>
          <div class="clinic-info">
            <h3>${clinic.name}</h3>
            <p class="clinic-type">${clinic.type}</p>
            <p class="clinic-location">📍 ${clinic.location}</p>
            <div class="clinic-services">
              ${clinic.services.map(s => `<span class="service-tag">${s}</span>`).join('')}
            </div>
            <button class="btn btn-secondary btn-small">View Details</button>
          </div>
        </div>
      `).join('');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderDoctors();
    }

    function filterDoctors() {
      renderDoctors();
    }

    function openBooking(doctorId) {
      const doctor = doctors.find(d => d.id === doctorId);
      const modal = document.getElementById('bookingModal');
      const modalBody = document.getElementById('modalBody');

      modalBody.innerHTML = `
        <div class="booking-doctor">
          <img src="${doctor.image}" alt="${doctor.name}">
          <div>
            <h3>${doctor.name}</h3>
            <p>${doctor.title}</p>
            <p>🏥 ${doctor.hospital}</p>
          </div>
        </div>
        <form class="booking-form" onsubmit="confirmBooking(event, ${doctor.id})">
          <div class="form-group">
            <label>Select Date</label>
            <input type="date" required min="${new Date().toISOString().split('T')[0]}">
          </div>
          <div class="form-group">
            <label>Select Time</label>
            <select required>
              <option value="">Choose a time slot</option>
              <option value="09:00">9:00 AM</option>
              <option value="10:00">10:00 AM</option>
              <option value="11:00">11:00 AM</option>
              <option value="14:00">2:00 PM</option>
              <option value="15:00">3:00 PM</option>
              <option value="16:00">4:00 PM</option>
            </select>
          </div>
          <div class="form-group">
            <label>Reason for Visit</label>
            <textarea placeholder="Briefly describe your symptoms or reason for consultation" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Confirm Booking</button>
        </form>
      `;

      modal.classList.add('active');
    }

    function viewClinic(clinicId) {
      const clinic = clinics.find(c => c.id === clinicId);
      const modal = document.getElementById('bookingModal');
      const modalBody = document.getElementById('modalBody');

      modalBody.innerHTML = `
        <div class="clinic-detail">
          <img src="${clinic.image}" alt="${clinic.name}" class="clinic-detail-image">
          <h3>${clinic.name}</h3>
          <p class="clinic-type">${clinic.type}</p>
          <p>📍 ${clinic.location}</p>
          <h4>Services Available:</h4>
          <div class="clinic-services">
            ${clinic.services.map(s => `<span class="service-tag">${s}</span>`).join('')}
          </div>
          <div class="clinic-actions">
            <a href="teleconsultation.html" class="btn btn-primary">Book Consultation</a>
            <a href="https://wa.me/23273095177" target="_blank" class="btn btn-whatsapp">Contact via WhatsApp</a>
          </div>
        </div>
      `;

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('bookingModal').classList.remove('active');
    }

    function confirmBooking(event, doctorId) {
      event.preventDefault();
      alert('Appointment booked successfully! You will receive a confirmation shortly.');
      closeModal();
    }

    // Close modal on outside click
    document.getElementById('bookingModal').addEventListener('click', (e) => {
      if (e.target.classList.contains('modal')) {
        closeModal();
      }
    });

    // Initialize
    renderDoctors();
    renderClinics();
  </script>
</body>
</html>
